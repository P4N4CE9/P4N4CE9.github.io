name: Build and deploy to GitHub Pages

# триггер
on:
  push:
    branches:
      - main

# требуется дать workflow права на запись в репозиторий/Pages
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials true по умолчанию; явно указываем, чтобы checkout мог использовать GITHUB_TOKEN для push
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dart-sass globally
        run: npm install -g sass@1.62.1

      - name: Prepare public directory
        run: |
          rm -rf public
          mkdir -p public
          rsync -av --exclude='.git' --exclude='node_modules' . public/

      - name: Compile SCSS -> CSS
        run: |
          mkdir -p public/src/css
          sass src/scss/style.scss public/src/css/style.css --no-source-map --style=compressed

      - name: Update index.html to use compiled CSS
        run: |
          if [ -f public/index.html ]; then
            sed -i 's@/src/scss/style.scss@/src/css/style.css@g' public/index.html || true
          fi

      - name: Add .nojekyll (prevent Jekyll processing)
        run: touch public/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
